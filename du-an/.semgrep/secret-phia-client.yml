# Chặn biến bí mật server lọt vào bundle trình duyệt.
#
# Vì sao: Next.js nhúng GIÁ TRỊ của process.env.* được tham chiếu trong file "use client"
# vào JS gửi xuống browser. SUPABASE_SERVICE_ROLE_KEY bỏ qua RLS — lộ nó là lộ CẢ DB,
# không chỉ dữ liệu của người đang đăng nhập.
#
# Nguồn tên biến: .env.example. Thêm biến bí mật mới ⇒ thêm vào regex bên dưới trong
# CÙNG commit (cùng chỗ với .gitleaks.toml — hai hàng rào, một danh sách).

rules:
  - id: cam-bien-bi-mat-trong-use-client
    languages: [typescript]
    severity: ERROR
    message: >
      Biến bí mật server trong file "use client" — Next sẽ nhúng GIÁ TRỊ vào bundle
      gửi xuống trình duyệt. Chuyển logic vào server action / route handler.
    paths:
      include: ["**/modules/**", "**/app/**"]
    patterns:
      - pattern: process.env.$KEY
      - metavariable-regex:
          metavariable: $KEY
          regex: "^(SUPABASE_SERVICE_ROLE.*|DATABASE_URL|R2_SECRET_ACCESS_KEY|R2_ACCESS_KEY_ID|VERCEL_TOKEN|CRON_SECRET)$"
      - pattern-inside: |
          "use client";
          ...

  # service_role đi qua MỘT CỬA DUY NHẤT của core, nơi khác phải gọi client admin do cửa
  # đó xuất ra. Danh sách exclude dưới đây là CỬA DỰ KIẾN — dự án chưa có code ngày
  # 29/08/2026. Khi dựng cửa thật: đối chiếu lại danh sách này với đường dẫn thật, và chỉ
  # thêm cửa mới có chủ đích (mỗi dòng thêm vào đây là một chỗ chạm được service_role).
  - id: service-role-chi-o-cua-core
    languages: [typescript]
    severity: ERROR
    message: >
      SUPABASE_SERVICE_ROLE_KEY chỉ được chạm ở cửa admin của core — nơi khác phải đi
      qua client admin do cửa đó xuất ra.
    paths:
      include: ["**/modules/**", "**/app/**"]
      exclude:
        - "**/modules/core/auth/supabase-admin.ts"
    pattern: process.env.SUPABASE_SERVICE_ROLE_KEY
